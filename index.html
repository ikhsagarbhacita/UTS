<script>
// Constrain model dalam ruang lokal model
function localBox(root) {
    root.updateMatrixWorld(true);
    const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
    const m = new THREE.Matrix4(), box = new THREE.Box3(), part = new THREE.Box3();
    root.traverse(function (o) {
        if (!o.isMesh || !o.geometry) return;
        o.frustumCulled = false;
        let b;
        if (o.isSkinnedMesh) { o.computeBoundingBox(); b = o.boundingBox; }
        else { if (!o.geometry.boundingBox) o.geometry.computeBoundingBox(); b = o.geometry.boundingBox; }
        m.multiplyMatrices(inv, o.matrixWorld);
        part.copy(b).applyMatrix4(m);
        box.union(part);
    });
    return box;
}

// length: sisi terpanjang (m) | maxh: batas tinggi (m), 0 = bebas | height: skala berdasarkan tinggi (untuk manusia)
AFRAME.registerComponent("fit-model", {
    schema: { length: { type: "number", default: 5 }, maxh: { type: "number", default: 0 }, height: { type: "number", default: 0 }, center: { type: "boolean", default: false } },
    init: function () {
        this.el.addEventListener("model-loaded", () => {
            const root = this.el.getObject3D("mesh");
            if (!root) return;
            root.position.set(0, 0, 0); root.rotation.set(0, 0, 0); root.scale.set(1, 1, 1);
            const box = localBox(root);
            if (box.isEmpty()) return;
            const d = this.data, size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
            let turn = 0, s;
            if (d.height > 0) {
                s = d.height / size.y;
            } else {
                turn = size.z > size.x ? Math.PI / 2 : 0;
                s = d.length / Math.max(size.x, size.z);
                if (d.maxh > 0) s = Math.min(s, d.maxh / size.y);
            }
            root.rotation.y = turn;
            root.scale.setScalar(s);
            c.multiplyScalar(s);
            c.applyAxisAngle(new THREE.Vector3(0, 1, 0), turn);
            root.position.set(-c.x, d.center ? -c.y : -box.min.y * s, -c.z);
            this.el.emit("fitted");
        });
    }
});

// Label
AFRAME.registerComponent("face-camera", {
    init: function () { this.t = new THREE.Vector3(); },
    tick: function () {
        const cam = this.el.sceneEl.camera;
        if (!cam) return;
        cam.getWorldPosition(this.t);
        this.el.object3D.lookAt(this.t);
    }
});
</script>

function seeded(seed) {
    let s = seed;
    return function () { s = (s * 16807) % 2147483647; return s / 2147483647; };
}

function conifer(x, z, s) {
    return `<a-entity position="${x} 0 ${z}" scale="${s} ${s} ${s}">
        <a-cylinder position="0 1 0" radius="0.25" height="2" color="#5a4636"></a-cylinder>
        <a-cone position="0 3 0" radius-bottom="1.5" radius-top="0.1" height="3.2" color="#2f6b4f"></a-cone>
        <a-cone position="0 4.6 0" radius-bottom="1.1" radius-top="0.05" height="2.6" color="#357a58"></a-cone></a-entity>`;
}

function roundTree(x, z, s) {
    return `<a-entity position="${x} 0 ${z}" scale="${s} ${s} ${s}">
        <a-cylinder position="0 1.1 0" radius="0.3" height="2.2" color="#6b4f3a"></a-cylinder>
        <a-sphere position="0 3.2 0" radius="1.6" segments-width="10" segments-height="8" color="#6f9a3d"></a-sphere>
        <a-sphere position="0.9 2.7 0.4" radius="1" segments-width="10" segments-height="8" color="#7aa845"></a-sphere></a-entity>`;
}

function scatterProps(page, centerZ, clearRadius) {
    const rand = seeded(page.seed);
    let html = "";
    for (let i = 0; i < 46; i++) {
        const a = rand() * Math.PI * 2, d = 13 + rand() * 24;
        const x = Math.sin(a) * d, z = -Math.cos(a) * d, s = 0.8 + rand() * 1.1;
        if (Math.hypot(x, z - centerZ) < clearRadius) continue;
        html += page.theme === "jurassic" ? conifer(x, z, s) : roundTree(x, z, s);
    }
    for (let i = 0; i < 14; i++) {
        const a = rand() * Math.PI * 2, d = 8 + rand() * 25;
        const x = Math.sin(a) * d, z = -Math.cos(a) * d, r = 0.3 + rand() * 0.6;
        if (Math.hypot(x, z - centerZ) < clearRadius) continue;
        html += `<a-dodecahedron position="${x} ${r * 0.5} ${z}" radius="${r}" color="#7d7468"></a-dodecahedron>`;
    }
    return html;
}

function volcano() {
    return `<a-cone position="-24 7 -42" radius-bottom="13" radius-top="3" height="14" color="#54433d"></a-cone>
        <a-cylinder position="-24 14.05 -42" radius="3" height="0.2" material="shader: flat; color: #ff6a2b"></a-cylinder>
        <a-sphere position="-24 17 -42" radius="3" color="#8a8a8a" opacity="0.5" material="transparent: true"
            animation="property: position; to: -20 24 -42; dur: 7000; easing: linear; loop: true"></a-sphere>`;
}

function statBoard(page) {
    let rows = "";
    page.stats.forEach(function (row, i) {
        const y = 0.45 - i * 0.3;
        rows += `<a-text value="${row[0]}" position="-1.55 ${y} 0.02" anchor="left" width="3" color="#9aa4b5"></a-text>
                 <a-text value="${row[1]}" position="-0.3 ${y} 0.02" anchor="left" width="3" color="#ffffff"></a-text>`;
    });
    return `<a-entity position="-3.7 2.6 -4.5" rotation="0 25 0">
        <a-plane width="3.4" height="2.9" color="#12151f" opacity="0.92"></a-plane>
        <a-text value="${page.title}" position="0 1.2 0.02" align="center" width="3.4" color="#ffd36b"></a-text>
        <a-text value="${page.meaning}" position="0 0.88 0.02" align="center" width="2.8" color="#c9ced8"></a-text>
        ${rows}
        <a-text value="Klik dinosaurus untuk jeda / lanjut putar" position="0 -1.3 0.02" align="center" width="2.4" color="#7f8aa0"></a-text>
    </a-entity>`;
}

function buildDinoRoom(page) {
    const room = document.createElement("a-entity");
    const r = page.showLength / 2 + 1, cz = -(r + 5);
    const fit = `length: ${page.showLength}; maxh: 6.5`;

    room.id = "room-" + page.id;
    room.classList.add("room");
    room.innerHTML = `
        ${scatterProps(page, cz, r + 3)}
        ${page.theme === "cretaceous" ? volcano() : ""}
        <a-cylinder position="0 0.2 ${cz}" radius="${r}" height="0.4" color="#4a4a4a"></a-cylinder>
        <a-cylinder position="0 0.42 ${cz}" radius="${r - 0.4}" height="0.05" color="#6a6a6a"></a-cylinder>
        <a-entity id="${page.id}Spin" position="0 0.45 ${cz}" rotation="0 30 0"
            animation="property: rotation; from: 0 30 0; to: 0 390 0; dur: 40000; easing: linear; loop: true">
            <a-entity id="${page.id}Live" gltf-model="${page.model}" fit-model="${fit}"></a-entity>
            ${page.fossil ? `<a-entity id="${page.id}Fossil" visible="false" gltf-model="${page.fossil}" fit-model="${fit}"></a-entity>` : ""}
        </a-entity>
        <a-cylinder id="${page.id}Hit" class="hit-${page.id}" position="0 2 ${cz}" radius="${page.showLength / 4}" height="4" material="opacity: 0; transparent: true"></a-cylinder>
        ${statBoard(page)}`;
    scene.appendChild(room);

    document.querySelector("#" + page.id + "Hit").addEventListener("click", function () {
        const spin = document.querySelector("#" + page.id + "Spin");
        spin.setAttribute("animation", "enabled", !spin.getAttribute("animation").enabled);
    });
}

function buildSizeRoom() {

    const R = 22;
    const dinos = pages.filter(function (p) { return p.model; });
    let angle = -82;

    room.id = "room-size";
    room.classList.add("room");

    let html = `
        <a-text value="PERBANDINGAN UKURAN" position="0 4 -7" align="center" width="9" color="#f2e3b3"></a-text>
        <a-text value="Real-time Size*." position="0 3.4 -7" align="center" width="5" color="#aeb6c6"></a-text>

        <a-ring position="0 0.02 0" rotation="-90 0 0" radius-inner="${R - 0.1}" radius-outer="${R + 0.1}" color="#ffffff" opacity="0.25" material="transparent: true"></a-ring>

        <a-entity position="-6.5 0 -6">
            <a-entity id="humanFallback">
                <a-cylinder position="0 0.42 0" radius="0.13" height="0.84" color="#4a5a7a"></a-cylinder>
                <a-box position="0 1.14 0" width="0.45" height="0.6" depth="0.22" color="#c9704f"></a-box>
                <a-sphere position="0 1.58 0" radius="0.12" color="#e2c2a0"></a-sphere>
            </a-entity>
            <a-entity id="humanModel" gltf-model="Assets/smart_casual_studio_portrait.glb" fit-model="height: 1.7"></a-entity>
            <a-text face-camera value="Manusia Dewasa\n1,7 m" position="0 2.3 0" align="center" width="3" color="#ffffff"></a-text>
        </a-entity>`;

    // Penggaris 10m
    for (let i = 0; i < 10; i++) {
        html += `<a-box position="${-4.5 + i} 0.03 -6" width="1" height="0.06" depth="0.25" color="${i % 2 ? "#3b4254" : "#f2e3b3"}"></a-box>`;
    }
    [["0 m", -5], ["5 m", 0], ["10 m", 5]].forEach(function (t) {
        html += `<a-text value="${t[0]}" position="${t[1]} 0.35 -6" align="center" width="2" color="#f2e3b3"></a-text>`;
    });

    dinos.forEach(function (p) {
        const span = (p.realLength / R) * 57.2958;
        const mid = angle + span / 2, rad = mid * Math.PI / 180;
        const x = Math.sin(rad) * R, z = -Math.cos(rad) * R;
        html += `
            <a-entity position="${x} 0 ${z}" rotation="0 ${-mid} 0">
                <a-entity gltf-model="${p.model}" fit-model="length: ${p.realLength}"></a-entity>
            </a-entity>
            <a-text face-camera value="${p.title}\n${fmt(p.realLength)} m" position="${x} ${p.realLength * 0.3 + 2.5} ${z}" align="center" width="14" color="#ffe9a8"></a-text>`;
        angle += span + 12;
    });

    room.innerHTML = html;
    scene.appendChild(room);

    document.querySelector("#humanModel").addEventListener("fitted", function () {
        document.querySelector("#humanFallback").setAttribute("visible", false);
    });
}

function showInfo(html) {
    infoContent.innerHTML = html;
    infoPanel.style.display = "block";

// Fosil Brachiosaurus: dibuka lewat penampil Sketchfab (iframe), loaded hanya saat dibutuhkan
function showFossilEmbed(page) {
    fossilFrame.setAttribute("src", page.fossilEmbed);
    fossilPanel.style.display = "block";
}
function hideFossilEmbed() {
    fossilPanel.style.display = "none";
    fossilFrame.removeAttribute("src");
}

function hideInfo() {
    infoPanel.style.display = "none";
    hideFossilEmbed();
}

function updateFossil() {
    const p = pages[currentScene];
    if (!p.model) return;

    const live = document.querySelector("#" + p.id + "Live");
    const fos = document.querySelector("#" + p.id + "Fossil");

    if (fos) {
        live.setAttribute("visible", !fossilOn);
        fos.setAttribute("visible", fossilOn);
    }

    if (p.fossilEmbed) {
        fossilLabel.setAttribute("value", "LIHAT FOSIL");
        fossilNote.setAttribute("value", "Fosil dibuka lewat penampil 3D Sketchfab.");
        return;
    }

    fossilLabel.setAttribute("value", fossilOn ? "LIHAT REKONSTRUKSI" : "LIHAT FOSIL");
    fossilNote.setAttribute("value", fossilOn
        ? "Rangka fosil: sisa makhluk purba yang tulangnya telah membatu."
        : "Rekonstruksi wujud hidup berdasarkan penelitian.");
}

function changeScene(index) {
    const page = pages[index];
    currentScene = index;

    fossilOn = false;
    pages.filter(function (p) { return p.model; }).forEach(function (p) {
        document.querySelector("#" + p.id + "Live").setAttribute("visible", true);
        const fos = document.querySelector("#" + p.id + "Fossil");
        if (fos) fos.setAttribute("visible", false);
    });

    document.querySelectorAll(".room").forEach(function (room) {
        room.setAttribute("visible", room.id === "room-" + page.id);
    });

    sky.setAttribute("color", page.sky);
    ground.setAttribute("color", page.ground);
    scene.setAttribute("fog", { type: "linear", color: page.sky, near: page.fog[0], far: page.fog[1] });

    pageLabel.setAttribute("value", (index + 1) + " / " + pages.length + "   " + page.title);
    prevButton.setAttribute("visible", currentScene > 0);
    nextButton.setAttribute("visible", currentScene < pages.length - 1);

    fossilButton.setAttribute("visible", !!page.model);
    fossilNote.setAttribute("visible", !!page.model);
    updateFossil();

    cursor.setAttribute("raycaster", "objects", ".nav, .hit-" + page.id + (page.model ? ", .fossil" : ""));

    camera.object3D.position.x = 0;
    camera.object3D.position.z = 0;

    hideInfo();
    if (page.id === "quiz") startQuiz();
}

infoButton.addEventListener("click", function () { showInfo(pages[currentScene].info); });
closeInfo.addEventListener("click", hideInfo);
closeFossil.addEventListener("click", hideFossilEmbed);
document.addEventListener("keydown", function (e) { if (e.key === "Escape") hideInfo(); });
infoPanel.addEventListener("click", function (e) { if (e.target === infoPanel) hideInfo(); });

nextButton.addEventListener("click", function () { if (currentScene < pages.length - 1) changeScene(currentScene + 1); });
prevButton.addEventListener("click", function () { if (currentScene > 0) changeScene(currentScene - 1); });
homeButton.addEventListener("click", function () { changeScene(0); });
fossilButton.addEventListener("click", function () {
    const p = pages[currentScene];
    if (p.fossilEmbed) { showFossilEmbed(p); return; }
    fossilOn = !fossilOn;
    updateFossil();
});

// Animasi hover 
function addFx(el, base, hover) {
    el.setAttribute("animation__in", "property: scale; to: 1.18 1.18 1.18; startEvents: mouseenter; dur: 160; easing: easeOutQuad");
    el.setAttribute("animation__out", "property: scale; to: 1 1 1; startEvents: mouseleave; dur: 160; easing: easeOutQuad");
    el.setAttribute("animation__colin", "property: material.color; type: color; to: " + hover + "; startEvents: mouseenter; dur: 160");
    el.setAttribute("animation__colout", "property: material.color; type: color; to: " + base + "; startEvents: mouseleave; dur: 160");
    el.setAttribute("animation__click", "property: scale; from: 0.8 0.8 0.8; to: 1.18 1.18 1.18; startEvents: click; dur: 260; easing: easeOutBack");
}
addFx(nextButton, "#e0b24a", "#ffe08a");
addFx(prevButton, "#e0b24a", "#ffe08a");
addFx(infoButton, "#2a3142", "#4a6fd0");
addFx(homeButton, "#2a3142", "#3d4860");
addFx(fossilButton, "#6b4a2b", "#9a6d3f");

// Quiz
const quizCount = document.querySelector("#quizCount");
const quizScoreText = document.querySelector("#quizScore");
const quizQuestion = document.querySelector("#quizQuestion");
const answerBoxes = [0, 1, 2].map(function (i) { return document.querySelector("#answer" + i); });
const answerTexts = [0, 1, 2].map(function (i) { return document.querySelector("#answerText" + i); });

let quizIndex = 0, quizScore = 0, quizLocked = false, quizDone = false, quizRun = 0;

function startQuiz() {
    quizRun++;
    quizIndex = 0;
    quizScore = 0;
    quizDone = false;
    showQuestion();
}

function showQuestion() {
    const item = quiz[quizIndex];
    quizLocked = false;
    quizCount.setAttribute("value", "Pertanyaan " + (quizIndex + 1) + " dari " + quiz.length);
    quizScoreText.setAttribute("value", "Skor: " + quizScore);
    quizQuestion.setAttribute("value", item.q);
    answerBoxes.forEach(function (box, i) {
        box.setAttribute("visible", true);
        box.setAttribute("color", "#2a3142");
        answerTexts[i].setAttribute("value", item.options[i]);
    });
}

function finishQuiz() {
    let message = "Jelajahi lagi aula-aula museum lalu coba sekali lagi.";
    if (quizScore === quiz.length) message = "Skor sempurna! Kamu layak jadi pemandu museum ini.";
    else if (quizScore >= 3) message = "Kerja bagus, kamu paham soal dinosaurus.";

    quizDone = true;
    quizCount.setAttribute("value", "Selesai");
    quizScoreText.setAttribute("value", "Skor: " + quizScore);
    quizQuestion.setAttribute("value", "Kamu benar " + quizScore + " dari " + quiz.length + ".\n" + message);

    answerBoxes[0].setAttribute("visible", false);
    answerBoxes[2].setAttribute("visible", false);
    answerBoxes[1].setAttribute("visible", true);
    answerBoxes[1].setAttribute("color", "#2a3142");
    answerTexts[1].setAttribute("value", "Main lagi");
}

function chooseAnswer(i) {
    if (quizDone) { if (i === 1) startQuiz(); return; }
    if (quizLocked) return;
    quizLocked = true;

    const item = quiz[quizIndex], run = quizRun;

    if (i === item.answer) {
        quizScore++;
        answerBoxes[i].setAttribute("color", "#2e7d32");
    } else {
        answerBoxes[i].setAttribute("color", "#b23b3b");
        answerBoxes[item.answer].setAttribute("color", "#2e7d32");
    }
    quizScoreText.setAttribute("value", "Skor: " + quizScore);

    setTimeout(function () {
        if (run !== quizRun) return;
        quizIndex++;
        if (quizIndex < quiz.length) showQuestion(); else finishQuiz();
    }, 1400);
}

answerBoxes.forEach(function (box, i) {
    box.addEventListener("click", function () { chooseAnswer(i); });
});

if (scene.hasLoaded) changeScene(0);
else scene.addEventListener("loaded", function () { changeScene(0); });
</script>
